<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☁️ АСМАН ЖЫЛАНЫ ☁️</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #81d4fa, #b2ebf2);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      text-align: center;
    }
    h1 {
      font-size: 2.8rem;
      text-shadow: 0 0 20px #4fc3f7;
      margin-bottom: 10px;
    }
    .info {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }
    canvas {
      border: 6px solid #fff;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      background: #81d4fa;
    }
    .controls {
      margin-top: 20px;
    }
    button {
      padding: 14px 28px;
      margin: 8px;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      color: white;
    }
    #startBtn { background: #4caf50; }
    #pauseBtn { background: #ff9800; }
    #restartBtn { background: #2196f3; }
  </style>
</head>
<body>
  <h1>☁️ АСМАН ЖЫЛАНЫ ☁️</h1>
  <div class="info">
    Упай: <span id="score">0</span> | Рекорд: <span id="highscore">0</span>
  </div>
  <canvas id="gameCanvas" width="640" height="640"></canvas>
  
  <div class="controls">
    <button id="startBtn">▶️ БАШТОО</button>
    <button id="pauseBtn">⏸️ ПАУЗА</button>
    <button id="restartBtn">🔄 КАЙРА БАШТОО</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highscoreEl = document.getElementById("highscore");

    const grid = 20;
    let snake = [{ x: 320, y: 320 }];
    let dx = grid;
    let dy = 0;
    let food = { x: 140, y: 140 };
    let score = 0;
    let gameInterval = null;
    let isPaused = false;

    function randomFood() {
      food.x = Math.floor(Math.random() * 32) * grid;
      food.y = Math.floor(Math.random() * 32) * grid;
    }

    function drawBackground() {
      ctx.fillStyle = "#81d4fa";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.beginPath(); ctx.ellipse(200, 150, 80, 40, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(280, 120, 60, 35, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(450, 180, 90, 45, 0, 0, Math.PI*2); ctx.fill();
    }

    function drawSnake() {
      snake.forEach((part, i) => {
        ctx.fillStyle = i === 0 ? "#1b5e20" : "#4caf50";
        ctx.fillRect(part.x, part.y, grid, grid);
      });
    }

    function drawFood() {
      ctx.fillStyle = "#f50057";
      ctx.beginPath();
      ctx.arc(food.x + 10, food.y + 10, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0) head.x = canvas.width - grid;
      if (head.x >= canvas.width) head.x = 0;
      if (head.y < 0) head.y = canvas.height - grid;
      if (head.y >= canvas.height) head.y = 0;

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        randomFood();
      } else {
        snake.pop();
      }
    }

    function gameLoop() {
      if (isPaused) return;
      moveSnake();
      drawBackground();
      drawSnake();
      drawFood();
    }

    // Баскычтар
    document.getElementById("startBtn").addEventListener("click", () => {
      if (!gameInterval) {
        randomFood();
        gameInterval = setInterval(gameLoop, 100);
      }
    });

    document.getElementById("pauseBtn").addEventListener("click", () => {
      isPaused = !isPaused;
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      location.reload();
    });

    // Клавиатура
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" && dy !== grid) { dx = 0; dy = -grid; }
      if (e.key === "ArrowDown" && dy !== -grid) { dx = 0; dy = grid; }
      if (e.key === "ArrowLeft" && dx !== grid) { dx = -grid; dy = 0; }
      if (e.key === "ArrowRight" && dx !== -grid) { dx = grid; dy = 0; }
    });

    // Биринчи сүрөт
    drawBackground();
    drawSnake();
    drawFood();
  </script>
</body>
</html>
