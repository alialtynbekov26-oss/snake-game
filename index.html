<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☁️ АСМАН ЖЫЛАНЫ ☁️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>☁️ АСМАН ЖЫЛАНЫ ☁️</h1>
    
    <div class="info">
      <div>Упай: <span id="score">0</span></div>
      <div>Рекорд: <span id="highscore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="640" height="640"></canvas>

    <div class="controls">
      <button id="startBtn">▶️ БАШТОО</button>
      <button id="pauseBtn">⏸️ ПАУЗА</button>
      <button id="restartBtn">🔄 КАЙРА БАШТОО</button>
    </div>

    <div id="gameOver" class="overlay">
      <h2>Оюн Аяктады!</h2>
      <p>Упайыңыз: <span id="finalScore">0</span></p>
      <button id="playAgain">Кайра Ойноо</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
